name: CI

# `push` is scoped to `main`, so a push to a pull-request branch does not
# run every job a second time beside its `pull_request` run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. The lint reads the checkout, and the drift check reads the
# pin and the upstream release.
permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged.
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, so that a
      # lint failure above does not hide drift. `!cancelled()` rather than
      # `always()`, because a cancelled run should stop, and the
      # `checkout` clause keeps a failed checkout from being reported as a
      # missing pin.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main
